name: Uuenda tunniplaan

on:
  schedule:
    # 02:00 UTC = 05:00 Eesti suveajal, 04:00 talveajal
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# contents: write — töövoog commitib data.json ja changes.json.
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — versiooninumber tuleb commitide arvust, aga vaikimisi
      # kloonib checkout ainult viimase commiti ja loendur jääks igavesti 1 peale.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testid
        run: |
          node test-schedule.mjs
          node test-diff.mjs
          node test-bus.mjs
          node test-weather.mjs
          node test-stats.mjs

      # Kraabib kooli lehe ja võrdleb eelmise plaaniga.
      # Kui kooli HTML on muutunud, lõpeb see veaga ja deploy jääb tegemata —
      # nii jääb vana töötav plaan püsti, selle asemel et avaldada tühi tunniplaan.
      - name: Lae tunniplaan
        run: node scrape.mjs

      - name: Salvesta muudatused
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json changes.json; then
            echo "Tunniplaan ei muutunud."
          else
            git add data.json changes.json
            git commit -m "Tunniplaan uuendatud $(date -u +%Y-%m-%d)"
            git push
          fi

      # Tallinna GTFS -> bus/ . Neid faile ei commitita: tuletatud andmed,
      # mille ajalugu pole vaja ja mis risustaks tunniplaani muudatuste diffi.
      - name: Lae bussigraafikud
        run: node bus-data.mjs

      - name: Koosta veebisait
        run: |
          mkdir -p _site/icons
          cp index.html styles.css app.js schedule.js bus.js weather.js stats.js sw.js \
             manifest.webmanifest data.json changes.json holidays.json \
             notabledays.json namedays.json overrides.json _site/
          cp icons/*.png _site/icons/
          cp -r bus _site/bus
          touch _site/.nojekyll

          # Üks versiooninumber kahte kohta: jalusesse ja teenusetöötlejasse.
          # Number kasvab iga commitiga, seega muutub täpselt siis, kui sisu
          # muutub. Teenusetöötlejas tähendab uus number, et vana vahemälu
          # kustutatakse — ilma selleta võib telefon vana kesta edasi näidata.
          VER="1.0.$(git rev-list --count HEAD)"
          sed -i "s|<span class=\"foot-version\" data-version>[^<]*</span>|<span class=\"foot-version\" data-version>v$VER</span>|" _site/index.html
          sed -i "s|const VERSION = '[^']*';|const VERSION = '$VER';|" _site/sw.js
          grep -q "v$VER" _site/index.html || { echo "Versioon jäi jalusesse asendamata."; exit 1; }
          grep -q "const VERSION = '$VER';" _site/sw.js || { echo "Versioon jäi sw.js-is asendamata."; exit 1; }
          echo "Versioon: $VER"

          # Iga import peab saidil päriselt olemas olema. Ilma selleta 404-b üks
          # moodul ja terve rakendus jääb käivitumata — täpselt nii juhtus bus.js-iga.
          missing=0
          for f in $(grep -ohE "from '\./[^']+'" _site/*.js | sed "s/from '\.\///;s/'//" | sort -u); do
            if [ ! -f "_site/$f" ]; then echo "PUUDU: $f"; missing=1; fi
          done
          for f in $(grep -ohE '(href|src)="[^"]+"' _site/index.html | sed 's/.*="//;s/"//' | grep -v '^http'); do
            if [ ! -e "_site/$f" ]; then echo "PUUDU: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Saidilt puuduvad failid — ei avalda."; exit 1; }
          echo "Kõik viidatud failid on olemas."
          ls -la _site

      # Ehitus jääb siia, mitte Cloudflare'i: Pages ehitab ainult tõuke peale,
      # aga selle rakenduse mõte on igaöine uuendus ajastatud käivitusest.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=tunniplaan
