<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>Tunniplaan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tallinna 21. Kooli tunniplaan telefonis.">

<!-- Kodukuvale lisamine (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tunniplaan">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Klassi valik (esimesel avamisel) -->
<section id="picker" class="picker" hidden>
  <div class="picker-head">
    <h1>Vali oma klass</h1>
    <p>Valik jääb meelde. Saad seda hiljem muuta.</p>
  </div>
  <div id="picker-grid" class="picker-grid"></div>
</section>

<!-- Põhivaade -->
<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <button id="class-btn" class="class-chip" type="button" aria-label="Vaheta klassi"></button>
      <button id="info-btn" class="icon-btn" type="button" aria-label="Info ja seaded">☰</button>
    </div>
    <div class="day-head">
      <h1 id="day-title"></h1>
      <span id="day-badge" class="badge" hidden></span>
    </div>
    <nav id="weekstrip" class="weekstrip" aria-label="Nädalapäevad"></nav>
  </header>

  <main id="lessons" class="lessons"></main>

  <footer class="foot">
    <span id="source-note"></span>
    <!-- Ühistranspordiregistri avaandmete tingimus: allikas peab olema nähtav. -->
    <span class="foot-credit">Bussiajad: Tallinna Linnatransport ja
      <a href="https://agri.ee/regionaalareng-uhistransport/uhistransport-ja-reisimine/uhistranspordiregistri-avaandmed">ühistranspordiregister</a></span>
    <!-- Ehitusel asendab töövoog selle kuupäeva ja commiti lühinumbriga.
         Kohapeal jääb "arendus" — nii on kohe näha, kas vaatad päris väljalaset. -->
    <span class="foot-version" data-version>arendus</span>
  </footer>
</div>

<!-- Seaded -->
<dialog id="sheet" class="sheet">
  <div class="sheet-inner">
    <h2>Info</h2>
    <dl id="sheet-info" class="info"></dl>
    <div class="sheet-actions">
      <button id="change-class" class="btn" type="button">Vaheta klassi</button>
      <button id="bus-setup-open" class="btn btn-quiet" type="button">🚌 Bussiajad</button>
      <button id="reset-picks" class="btn btn-quiet" type="button">Lähtesta rühmavalikud</button>
      <button id="close-sheet" class="btn btn-quiet" type="button">Sulge</button>
    </div>
  </div>
</dialog>

<!-- Bussiaegade seadistamine -->
<dialog id="bus-setup" class="sheet">
  <div class="sheet-inner">
    <h2>Bussiajad</h2>

    <div id="bus-routes" class="bus-routes"></div>

    <button id="bus-add-open" class="btn btn-quiet" type="button">＋ Lisa suund</button>

    <div id="bus-form" hidden>
      <p class="sheet-lead">Õige peatuse pool leiame ise.</p>

      <div class="seg" id="bus-dir" role="radiogroup" aria-label="Millal sõidad">
        <button type="button" class="seg-btn" data-dir="am" role="radio" aria-checked="false">Hommikul kooli</button>
        <button type="button" class="seg-btn is-on" data-dir="pm" role="radio" aria-checked="true">Pärast tunde koju</button>
      </div>

      <label class="field">
        <span id="bus-from-label">Kust lähed (kooli juurest)</span>
        <input id="bus-from" type="search" placeholder="nt Viru" autocomplete="off" enterkeyhint="search">
        <div id="bus-from-hits" class="stop-hits"></div>
      </label>

      <label class="field">
        <span id="bus-to-label">Kuhu sõidad (kodu juurde)</span>
        <input id="bus-to" type="search" placeholder="nt Balti jaam" autocomplete="off" enterkeyhint="search">
        <div id="bus-to-hits" class="stop-hits"></div>
      </label>

      <label class="field">
        <span>Jalutusaeg peatusesse (min)</span>
        <input id="bus-walk" type="number" min="0" max="60" step="1" inputmode="numeric">
      </label>

      <p id="bus-error" class="field-error"></p>

      <div class="sheet-actions">
        <button id="bus-save" class="btn" type="button">Salvesta</button>
        <button id="bus-cancel" class="btn btn-quiet" type="button">Loobu</button>
      </div>
    </div>

    <div id="bus-reverse" class="bus-reverse" hidden>
      <p id="bus-reverse-text"></p>
      <div class="sheet-actions">
        <button id="bus-reverse-add" class="btn" type="button">Lisa ka tagasitee</button>
        <button id="bus-reverse-skip" class="btn btn-quiet" type="button">Ei ole vaja</button>
      </div>
    </div>

    <div class="sheet-actions">
      <button id="bus-close" class="btn btn-quiet" type="button">Sulge</button>
    </div>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
